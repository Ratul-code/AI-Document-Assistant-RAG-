# =============================================================================
# AI Document Analyser — CI workflow
#
# What this does (explain-like-I'm-5):
#   Every time you push code, GitHub wakes up a robot that:
#     1. Re-checks your spelling/style (lint)
#     2. Asks "is this variable really a number?" (mypy)
#     3. Runs your quiz questions (pytest)
#     4. Grades the AI's answers (eval)
#     5. Blows smoke to see if the API is alive (smoke)
#     6. Builds the frontend (lint + type-check + build)
#   If all are happy: green badge. If not: red badge.
#
# Performance (the important bit for ML projects):
#   * Layer 1 — pip cache: stores downloaded Python packages so we don't
#     re-download 1.2GB of torch/transformers every run.
#   * Layer 2 — ML model cache: stores downloaded HuggingFace model files
#     so we don't re-download the embedding model every run.
#   * Backend & frontend run in PARALLEL on separate machines.
#   * Only changed paths trigger jobs (saves CI minutes on small commits).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    # Path filters: only run when relevant files change.
    # Backend job runs when backend/ or .github/ change.
    # Frontend job runs when frontend/ or .github/ change.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/**'
      - 'compose*.yaml'
      - 'Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/**'
      - 'compose*.yaml'
      - 'Dockerfile'

# Cancel in-progress runs when a new commit is pushed to the same PR/branch.
# Saves CI minutes when you push 5 commits in a row.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# Environment variables shared across jobs
# =============================================================================
env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # BACKEND JOB
  # Runs: lint + mypy + pytest + eval + smoke
  # ===========================================================================
  backend:
    name: Backend (lint + mypy + pytest + eval + smoke)
    runs-on: ubuntu-latest

    # Service containers: GitHub spins up Postgres + Redis for our tests
    # (like mini-Dockers). Your smoke test will talk to these.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        # Health check: wait until postgres is actually ready to accept
        # connections (otherwise tests fail with "connection refused").
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ---- 1. Get the code ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- 2. Install Python ----
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # =========================================================================
      # LAYER 1: pip cache
      # Restores downloaded .whl files from GitHub's storage.
      # The cache key is a HASH of the requirements files — if they don't
      # change, we use the cache. If they change, we rebuild it.
      # =========================================================================
      - name: Cache pip packages (Layer 1)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Hash ALL requirements files so changing any one invalidates cache.
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-ml.txt', 'backend/requirements-eval.txt', 'backend/requirements-dev.txt') }}
          # Fallback: if exact hash doesn't match, use the most recent cache
          # with the same Python version (partial match).
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
            pip-${{ runner.os }}-

      # =========================================================================
      # LAYER 2: ML model cache
      # HuggingFace models are downloaded to ~/.cache/huggingface/ on first use.
      # sentence-transformers also uses ~/.cache/torch/.
      # We cache these so we don't re-download ~80-500MB of model weights.
      # =========================================================================
      - name: Cache ML models (Layer 2)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
            /home/runner/.cache/huggingface
            /home/runner/.cache/torch
          # Key based on the ML requirements file.
          # The "-v1" suffix lets us bump the key manually if we change models.
          key: ml-models-v1-${{ hashFiles('backend/requirements-ml.txt') }}
          restore-keys: |
            ml-models-v1-
            ml-models-

      # Report cache status so we can SEE if caching is working
      - name: Report cache status
        run: |
          echo "::group::Cache diagnostics"
          echo "📦 pip cache size: $(du -sh ~/.cache/pip 2>/dev/null || echo 'empty')"
          echo "🤗 HF cache size: $(du -sh ~/.cache/huggingface 2>/dev/null || echo 'empty')"
          echo "🔥 torch cache size: $(du -sh ~/.cache/torch 2>/dev/null || echo 'empty')"
          echo "::endgroup::"

      # ---- 3. Install dependencies ----
      # We install dev tools (ruff, mypy) and the app dependencies.
      # pip will skip downloads for anything already in the cache.
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # requirements.txt already includes requirements-ml.txt (per file header),
          # so installing requirements.txt gets us everything except dev tools + eval.
          pip install -r requirements.txt
          pip install -r requirements-eval.txt
          pip install -r requirements-dev.txt

      # ---- 4. Lint with ruff ----
      - name: Lint (ruff)
        working-directory: backend
        run: |
          echo "🔍 Running ruff..."
          ruff check . --output-format=github
          ruff format --check .

      # ---- 5. Type-check with mypy ----
      - name: Type-check (mypy)
        working-directory: backend
        run: |
          echo "🔍 Running mypy..."
          mypy app

      # ---- 6. Run database migrations ----
      # The app NEVER creates tables itself — the schema comes from
      # Alembic migrations (`backend/alembic/versions/`). The Postgres
      # service container starts with an EMPTY database, so without
      # this step every DB-backed test fails with
      # `psycopg.errors.UndefinedTable: relation "users" does not exist`.
      #
      # Running the real migrations (rather than `create_all`) means CI
      # also verifies the migration files themselves are valid and
      # apply cleanly — `create_all` would happily build a schema that
      # production can never reach.
      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql+psycopg://test:test@localhost:5432/test
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-not-for-production-use-only-ci
        run: |
          echo "🗄️  Running Alembic migrations..."
          alembic upgrade head
          echo "🗄️  Verifying schema was created..."
          alembic current

      # ---- 7. Run pytest ----
      - name: Run tests (pytest)
        working-directory: backend
        env:
          # Service containers are reachable at localhost on the runner.
          # We use the SYNC URL because pytest + SQLAlchemy tests often
          # need a sync connection (Celery + Alembic patterns).
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql+psycopg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          # Test mode flags so the app doesn't try to talk to real LLM/Supabase.
          APP_ENV: test
          APP_DEBUG: 'false'
          JWT_SECRET: test-jwt-secret-not-for-production-use-only-ci
        run: |
          echo "🧪 Running pytest..."
          pytest -v --tb=short --maxfail=5

      # ---- 8. Run eval suite ----
      # The eval/ folder grades the LLM on test datasets. We run it in
      # a "smoke" mode if available, otherwise just run the eval tests.
      - name: Run eval suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql+psycopg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: test
          JWT_SECRET: test-jwt-secret-not-for-production-use-only-ci
        run: |
          echo "📊 Running eval suite..."
          # Try the eval pytest if it exists; otherwise skip gracefully.
          if [ -d "eval/tests" ]; then
            cd eval && pytest -v --tb=short || echo "⚠️  eval tests had failures (non-fatal for CI smoke)"
          else
            echo "ℹ️  No eval/tests directory found, skipping"
          fi

      # ---- 9. Smoke test the API ----
      # Start the API in the background, hit the health endpoint, kill it.
      # "Does the app even boot and respond?" — that's the smoke test.
      - name: Smoke test (API boots and responds)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          DATABASE_URL_SYNC: postgresql+psycopg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          APP_ENV: test
          APP_DEBUG: 'false'
          JWT_SECRET: test-jwt-secret-not-for-production-use-only-ci
        run: |
          echo "💨 Starting API + Celery worker for smoke test..."

          # Start a Celery worker. `/api/v1/health/ready` runs a
          # "celery" probe that round-trips the `app.tasks.document.ping`
          # task through the broker and waits for a WORKER to execute it
          # (see app/api/v1/endpoints/health.py::_sync_celery_ping). With
          # no worker running, the task sits in the queue and the probe
          # times out after 3s -> the endpoint returns 503 and `curl -fsS`
          # fails the step.
          #
          # `--pool=solo` runs tasks in the main process (no prefork),
          # which is what we want in a CI container: no extra processes,
          # no fork-safety concerns.
          celery -A app.core.celery_app worker \
            --loglevel=info --pool=solo > /tmp/celery.log 2>&1 &
          CELERY_PID=$!

          # Start uvicorn in the background, log to a file
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          UVICORN_PID=$!

          # Wait up to 60s for the server to be ready. The first run
          # downloads + loads the embedding model, which can take a
          # while on a cold CI cache.
          echo "⏳ Waiting for API to be ready..."
          API_UP=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live > /dev/null 2>&1; then
              echo "✅ API is up after ${i}s"
              API_UP=1
              break
            fi
            sleep 1
          done
          if [ "$API_UP" -ne 1 ]; then
            echo "❌ API did not come up in time. uvicorn log:"
            tail -50 /tmp/uvicorn.log
            exit 1
          fi

          # Wait for the Celery worker to register with the broker.
          # The readiness probe needs a worker that is actually
          # consuming, not one that has just been spawned.
          echo "⏳ Waiting for Celery worker to register..."
          WORKER_UP=0
          for i in $(seq 1 30); do
            if grep -q "ready\." /tmp/celery.log 2>/dev/null; then
              echo "✅ Celery worker ready after ${i}s"
              WORKER_UP=1
              break
            fi
            sleep 1
          done
          if [ "$WORKER_UP" -ne 1 ]; then
            echo "❌ Celery worker did not register in time. celery log:"
            tail -50 /tmp/celery.log
            exit 1
          fi

          # Hit the health endpoints
          echo "🏥 Hitting /api/v1/health/live..."
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          echo ""
          echo "🏥 Hitting /api/v1/health/ready..."
          # Print the body even on failure — the JSON names the failing
          # dependency (database / redis / celery / llm) and its detail.
          # `curl -fsS` alone hides it behind "exit code 22".
          READY_OUT=$(curl -sS -w "\n%{http_code}" http://127.0.0.1:8000/api/v1/health/ready) || true
          # Split body / status code portably. `head -n -1` is GNU-only
          # (BSD `head` on macOS rejects it with "illegal line count
          # -- -1") and `tail -n +2` still includes the LAST line, so
          # it would leave the status code in the body. `sed '$d'`
          # deletes the final line and works on both.
          READY_CODE=$(echo "$READY_OUT" | tail -n 1)
          READY_BODY=$(echo "$READY_OUT" | sed '$d')
          echo "$READY_BODY"
          if [ "$READY_CODE" != "200" ]; then
            echo "❌ Readiness check failed with HTTP $READY_CODE"
            echo "--- uvicorn log ---"; tail -30 /tmp/uvicorn.log
            echo "--- celery log ---";  tail -30 /tmp/celery.log
            exit 1
          fi
          echo "✅ Smoke test passed!"

          # Clean up
          kill $UVICORN_PID 2>/dev/null || true
          kill $CELERY_PID 2>/dev/null || true

      # ---- 10. Upload test reports (optional, useful for debugging) ----
      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/.pytest_cache
            backend/**/test-results.xml
            /tmp/uvicorn.log
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # FRONTEND JOB
  # Runs: lint + tsc + build
  # ===========================================================================
  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    # Skip this job if only backend files changed.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Built-in npm cache (Layer 1 for frontend).
          # Caches ~/.npm so we don't re-download 200+ packages.
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: |
          echo "📦 Installing npm packages (using cache)..."
          npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Type-check (tsc)
        working-directory: frontend
        run: |
          echo "🔍 Running TypeScript type-check..."
          # --noEmit means: just check types, don't write output files
          # (we want a clean build step separately).
          npx tsc --noEmit

      - name: Build (next build)
        working-directory: frontend
        env:
          # Build-time env vars. NEXT_PUBLIC_ vars are inlined at build time.
          # Use safe dummy values for CI so the build doesn't fail on missing vars.
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          echo "🏗️  Building Next.js..."
          npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next
          if-no-files-found: ignore
          retention-days: 7

  # ===========================================================================
  # CI SUCCESS CHECK
  # Single gate that turns the badge green/red.
  # Runs only after both backend and frontend complete.
  # ===========================================================================
  ci-success:
    name: CI Status
    runs-on: ubuntu-latest
    # This job needs both backend and frontend to pass.
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ One or more jobs failed."
            echo "  Backend:  ${{ needs.backend.result }}"
            echo "  Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
          echo "✅ All jobs passed — CI is green!"
